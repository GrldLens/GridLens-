<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GridLens</title>

  <style>
    body {
      margin: 0;
      background: #111214;
      color: white;
      font-family: Arial, sans-serif;
    }

    /* HEADER */
    .header {
      display: flex;
      align-items: center;
      padding: 15px 25px;
      border-bottom: 1px solid #333;
    }

    .logo {
      height: 60px;
      width: auto;
      object-fit: contain;
    }

    /* MAIN */
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    .search-box {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin-bottom: 25px;
      background: #24262a;
      color: white;
      border: 2px solid #168cff;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    .search-box::placeholder {
      color: #aaa;
    }

    /* PLAYER CARDS */
    .players {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 15px;
    }

    .card {
      display: flex;
      align-items: center;
      gap: 15px;
      background: #202226;
      border: 2px solid #168cff;
      border-radius: 10px;
      padding: 12px;
      cursor: pointer;
      transition: 0.2s;
    }

    .card:hover {
      background: #292c31;
      transform: translateY(-2px);
    }

    .card-photo {
      width: 78px;
      height: 78px;
      border-radius: 8px;
      object-fit: cover;
      background: #15171a;
      border: 1px solid #168cff;
      flex-shrink: 0;
    }

    .placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #168cff;
      font-size: 30px;
      font-weight: bold;
    }

    .card h3 {
      margin: 0 0 6px;
      font-size: 18px;
    }

    .card p {
      margin: 0;
      color: #bbb;
      font-size: 14px;
    }

    /* PROFILE */
    #profile {
      display: none;
    }

    .back-top {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #168cff;
      color: white;
      font-size: 28px;
      border: none;
      cursor: pointer;
      margin-bottom: 20px;
    }

    .profile-box {
      background: #202226;
      border: 2px solid #168cff;
      border-radius: 12px;
      padding: 25px;
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 25px;
      margin-bottom: 25px;
    }

    .player-photo {
      width: 150px;
      height: 150px;
      border-radius: 10px;
      object-fit: cover;
      border: 2px solid #168cff;
      background: #15171a;
    }

    .profile-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #168cff;
      font-size: 55px;
      font-weight: bold;
    }

    .profile-name {
      font-size: 32px;
      margin: 0 0 8px;
    }

    .profile-info {
      color: #bbb;
      line-height: 1.6;
    }

    .section {
      background: #17191c;
      border-radius: 8px;
      padding: 20px;
      margin-top: 15px;
    }

    .section h2 {
      margin-top: 0;
      color: #168cff;
    }

    .back-bottom {
      margin-top: 25px;
      padding: 12px 20px;
      background: #168cff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    /* MOBILE */
    @media (max-width: 600px) {
      .header {
        padding: 12px 15px;
      }

      .logo {
        height: 55px;
      }

      .container {
        padding: 25px 15px;
      }

      .profile-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .profile-name {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

    <img
      src="images/IMG_1273.jpeg"
      alt="GridLens"
      class="logo"
    >
  </header>

  <main class="container">

    <!-- PLAYER LIST -->
    <div id="playerList">

      <input
        type="text"
        id="search"
        class="search-box"
        placeholder="Search players..."
        oninput="searchPlayers()"
      >

      <div id="players" class="players"></div>

    </div>

    <!-- PLAYER PROFILE -->
    <div id="profile">

      <button class="back-top" onclick="showPlayers()">←</button>

      <div class="profile-box">

        <div class="profile-header">

          <div id="profilePhoto"></div>

          <div>
            <h1 id="profileName" class="profile-name"></h1>
            <div id="profileInfo" class="profile-info"></div>
          </div>

        </div>

        <div class="section">
          <h2>Stats</h2>
          <p>Player statistics will appear here.</p>
        </div>

        <div class="section">
          <h2>Analysis</h2>
          <p>Football analysis and research will appear here.</p>

    function displayPlayers(list = players) {

      const container = document.getElementById("players");

      container.innerHTML = "";

      list.forEach((player, index) => {

        const card = document.createElement("div");

        card.className = "card";

        let photoHTML;

        if (player.photo) {

          photoHTML = `
            <img
              src="${player.photo}"
              alt="${player.name}"
              class="card-photo"
            >
          `;

        } else {

          photoHTML = `
            <div class="card-photo placeholder">
              ${player.name.charAt(0)}
            </div>
          `;

        }

        card.innerHTML = `
          ${photoHTML}

          <div>
            <h3>${player.name}</h3>
            <p>${player.position} • ${player.team}</p>
          </div>
        `;

        card.onclick = () => openPlayer(index);

        container.appendChild(card);

      });

    }


    function searchPlayers() {

      const search = document
        .getElementById("search")
        .value
        .toLowerCase();

      const filtered = players.filter(player =>
        player.name.toLowerCase().includes(search)
      );

      displayPlayers(filtered);

    }


    function openPlayer(index) {

      const player = players[index];

      document.getElementById("playerList").style.display = "none";

      document.getElementById("profile").style.display = "block";

      document.getElementById("profileName").textContent = player.name;

      document.getElementById("profileInfo").innerHTML = `
        <strong>Position:</strong> ${player.position}<br>
        <strong>Team:</strong> ${player.team}<br>
        <strong>College:</strong> ${player.college}
      `;

      const photoContainer = document.getElementById("profilePhoto");

      if (player.photo) {

        photoContainer.innerHTML = `
          <img
            src="${player.photo}"
            alt="${player.name}"
            class="player-photo"
          >
        `;

      } else {

        photoContainer.innerHTML = `
          <div class="player-photo profile-placeholder">
            ${player.name.charAt(0)}
          </div>
        `;

      }

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    function showPlayers() {

      document.getElementById("profile").style.display = "none";

      document.getElementById("playerList").style.display = "block";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    displayPlayers();
